---
pfsense_address: 10.45.45.1
pfsense_api_host: pfsense.batchelor.live
pfsense_api_port: 443
pfsense_ssh_user: admin
pfsense_ssh_private_key_file: ~/.ssh/pfsense
pfsense_ssh_known_hosts_file: ~/.ssh/known_hosts
pfsense_dns_records: []
aap_organization: Default
aap_project_name: pfSense Automation
aap_project_revision: main
aap_inventory_name: pfSense DNS
aap_inventory_discovery_enabled: true
# Separate discovery credentials retain the old default for existing deployments.
aap_inventory_api_credential_name: "{{ aap_api_credential_name }}"
aap_inventory_enroll_readonly: false
# Set false for discovery-only reconciliation to preserve desired DNS declarations.
aap_inventory_manage_dns_records: true
aap_inventory_source_name: pfSense Live Discovery
aap_inventory_schedule_name: pfSense Daily Discovery
aap_inventory_schedule_enabled: true
# Fixed anchor: never derive DTSTART from the current deployment time.
aap_inventory_schedule_rrule: 'DTSTART;TZID=America/New_York:20261029T060000 RRULE:FREQ=DAILY;INTERVAL=1'
aap_workflow_name: pfSense DNS Deploy
aap_api_credential_name: pfSense DNS API
aap_machine_credential_name: pfSense Bootstrap SSH
aap_ee_name: pfSense DNS EE
aap_instance_groups: [default]
aap_launch: true
aap_operator_team: pfSense DNS Operators
ee_build_namespace: aap
ee_image_name: pfsense-dns-ee
ee_base_image: registry.redhat.io/ansible-automation-platform-27/ee-supported-rhel9@sha256:b08dcf736e08e75c4c6b462545bbce85690cc55c45fee3d0eb1516a28b149473
# Reporting is isolated from DNS resources. Enable its schedule after live acceptance.
aap_snort_enabled: true
aap_snort_project_name: pfSense Snort Reporting
aap_snort_project_revision: "{{ aap_project_revision }}"
aap_snort_inventory_name: pfSense Snort Reporting
aap_snort_template_name: pfSense Snort Daily Report
aap_snort_schedule_name: pfSense Snort Daily Report
aap_snort_schedule_enabled: false
aap_snort_schedule_rrule: 'DTSTART:20261104T111500Z RRULE:FREQ=DAILY;INTERVAL=1'
snort_min_count: 20
snort_multiplier: 5
snort_scan_threshold: 20
snort_max_groups: 100
snort_max_bytes: 67108864
