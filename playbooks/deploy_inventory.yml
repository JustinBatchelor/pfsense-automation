---
- name: Restore inventory discovery and its prerequisites without firewall jobs
  hosts: localhost
  gather_facts: false
  vars_files: [../vars/defaults.yml]
  tasks:
    - name: Apply discovery-only configuration
      ansible.builtin.include_role:
        name: aap_deploy
        tasks_from: restore_inventory.yml
      vars:
        aap_inventory_manage_dns_records: false
