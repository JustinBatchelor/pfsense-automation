---
name: Optional DNS A or AAAA record
description: >-
  Choose survey to create, update, or delete DNS records. Inventory mode uses pfsense_dns_records.
spec:
  - question_name: DNS input
    question_description: Choose survey to use the fields below; otherwise use the inventory declarations.
    variable: pfsense_dns_input
    type: multiplechoice
    required: false
    default: inventory
    choices: "inventory\nsurvey"
  - question_name: Action
    question_description: >-
      upsert replaces the selected address family; delete_type removes only that family;
      delete_host removes the entire override, including all A/AAAA addresses and aliases.
      Deleting the last address family also removes the override and its aliases.
    variable: pfsense_dns_survey_action
    type: multiplechoice
    required: false
    default: upsert
    choices: "upsert\ndelete_type\ndelete_host"
  - question_name: Host name
    question_description: Host portion only, such as app. Leave empty for the domain apex.
    variable: pfsense_dns_survey_host
    type: text
    required: false
    default: ''
    min: 0
    max: 253
  - question_name: Domain
    question_description: Required in survey mode, such as home.arpa.
    variable: pfsense_dns_survey_domain
    type: text
    required: false
    default: ''
    min: 0
    max: 253
  - question_name: Record type
    question_description: Family to upsert or delete. Ignored for delete_host.
    variable: pfsense_dns_survey_type
    type: multiplechoice
    required: false
    default: A
    choices: "A\nAAAA"
  - question_name: IP address
    question_description: Required only for upsert. Must match A or AAAA. Ignored for deletion.
    variable: pfsense_dns_survey_address
    type: text
    required: false
    default: ''
    min: 0
    max: 45
  - question_name: Description
    question_description: Optional. Leave empty to preserve the existing description.
    variable: pfsense_dns_survey_description
    type: text
    required: false
    default: ''
    min: 0
    max: 255
